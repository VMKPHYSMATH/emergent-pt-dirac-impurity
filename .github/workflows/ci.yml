name: reproducibility

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python reproducibility/finite_u_contact/verify_finiteU_contact_algebra.py
      - run: python reproducibility/analytic_checks/contact_and_smith_identity_check.py
      - run: python reproducibility/bethe_smith_phase/bethe_smith_phase_gate.py
      - run: python benchmarks/prb_complete/tests/validate_biorth_fix.py
        working-directory: reproducibility/nrg_jordan_residue/adapter
      - run: python benchmarks/prb_complete/tests/validate_install.py
        working-directory: reproducibility/nrg_jordan_residue/adapter
      - run: python benchmarks/prb_complete/tests/validate_jordan_comprehensive.py
        working-directory: reproducibility/nrg_jordan_residue/adapter
      - run: python benchmarks/prb_complete/tests/validate_fullk_n_scaling_install.py
        working-directory: reproducibility/nrg_jordan_residue/adapter
      - run: python reproducibility/full_k_finite_u/full_k_two_cut_ep_certificate.py --soc 0.05 --out /tmp/full_k_two_cut_ep
      - run: python reproducibility/full_k_finite_u/full_k_ep_soc_family.py --out /tmp/full_k_ep_soc_family
      - run: python reproducibility/full_k_finite_u/finiteU_fullk_reproducibility/validate_archived_finiteU_gates.py
      - run: python reproducibility/full_k_finite_u/validate_fullk_n_scaling_gate.py

  revision-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: make check-revision

